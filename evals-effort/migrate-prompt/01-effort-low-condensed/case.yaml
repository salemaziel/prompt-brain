schema_version: "1.1"
name: 01-effort-low-condensed
description: The low half of migrate case 09 — under CLAUDE_CODE_EFFORT_LEVEL=low the skill runs its condensed pass and never reads examples.md.
tags: [migrate, effort-low]
execution:
  prompt: |-
    /prompt-brain:migrate-prompt deepseek-r1 opus-4.8 Review the diff in review.patch and list every correctness bug. Think step by step before answering and show your reasoning.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-loaded
    type: regex
    target: trace
    pattern: 'Prompt Migration Algorithm'
    match: contains
    arm: with-only
  - name: effort-low-reached-skill
    type: regex
    target: trace
    pattern: 'Current session effort: `low`'
    match: contains
    arm: with-only
  - name: reads-exactly-two-guides
    type: tool_used
    tool: Read
    input_match: model-guides
    min: 2
    max: 2
  - name: no-examples-at-low-effort
    type: tool_used
    tool: Read
    input_match: 'examples\.md'
    min: 0
    max: 0
  - name: no-guide-folder-enumeration
    type: tool_used
    tool: Glob
    input_match: model-guides
    min: 0
    max: 0
  - name: no-grep
    type: tool_used
    tool: Grep
    min: 0
    max: 0
expected_outcome: |-
  - The low half of `evals/migrate-prompt/09-effort-adaptive-depth`: run with
    `CLAUDE_CODE_EFFORT_LEVEL=low claude plugin eval . --eval-dir evals-effort --tag effort-low`;
    the condensed pass reads the two guides and does NOT read `examples.md`.
