schema_version: "1.1"
name: 02-effort-max-full
description: The max half of migrate case 09 — under CLAUDE_CODE_EFFORT_LEVEL=max the skill runs the full algorithm across every accommodation category.
tags: [migrate, effort-max]
execution:
  prompt: |-
    /prompt-brain:migrate-prompt deepseek-r1 opus-4.8 Review the diff in review.patch and list every correctness bug. Think step by step before answering and show your reasoning.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-loaded
    type: regex
    target: trace
    pattern: 'Prompt Migration Algorithm'
    match: contains
    arm: with-only
  - name: effort-max-reached-skill
    type: regex
    target: trace
    pattern: 'Current session effort: `max`'
    match: contains
    arm: with-only
  - name: reads-exactly-two-guides
    type: tool_used
    tool: Read
    input_match: model-guides
    min: 2
    max: 2
  - name: no-guide-folder-enumeration
    type: tool_used
    tool: Glob
    input_match: model-guides
    min: 0
    max: 0
  - name: no-grep
    type: tool_used
    tool: Grep
    min: 0
    max: 0
  - name: changelog-covers-more-than-one-change
    type: llm
    focus: last_message
    criteria: |-
      Does the changelog address more than the single highest-impact change, i.e. both the
      forced step-by-step / show-your-reasoning scaffolding and the reasoning/thinking handling
      for the target?
expected_outcome: |-
  - The max half of `evals/migrate-prompt/09-effort-adaptive-depth`: run with
    `CLAUDE_CODE_EFFORT_LEVEL=max claude plugin eval . --eval-dir evals-effort --tag effort-max`;
    the full algorithm covers every accommodation category from Step 3.
