name: validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Both actions on their current major (node24 runtime; GitHub removed Node 20 from
      # hosted runners on 2026-09-23). fetch-depth: 0 fetches all history AND tags, which the
      # release-drift check in check-release-consistency.mjs diffs skills/ against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Registry / guide sync check
        run: node scripts/check-registry-sync.mjs
      - name: Skill frontmatter check
        run: node scripts/check-frontmatter.mjs
      - name: Cross-skill block sync check
        run: node scripts/check-skill-block-sync.mjs
      - name: Release consistency check
        # On push, skills/ content changed since the current version's release tag without a
        # version bump fails the build (--require-bump): installed users only receive a new
        # copy when the version changes. On a pull request it is reported as a WARN only.
        run: node scripts/check-release-consistency.mjs ${{ github.event_name == 'push' && '--require-bump' || '' }}
      - name: Install Claude Code CLI
        # Pinned deliberately: an unpinned global install lets a CLI release turn a green
        # build red with no commit. Bump this line when you want the new version.
        run: npm install -g @anthropic-ai/claude-code@2.1.288
      - name: Validate marketplace manifest (strict)
        # Targets the manifest FILE, not '.': from CLI v2.1.289 a directory holding both
        # manifests also validates the plugin, whose permanent root-CLAUDE.md warning --strict
        # would fail. Through the "./" entry this run still reads plugin.json (an unknown field
        # there fails it); the plugin's component files (skills included) are covered by the step below.
        run: claude plugin validate .claude-plugin/marketplace.json --strict
      - name: Validate plugin manifest and components (warnings gated)
        # Deliberately NOT --strict: the root CLAUDE.md is maintainer project memory,
        # intentionally not plugin-shipped context, so the validator warns about it on
        # every run and --strict would turn that permanent, accepted warning into a hard
        # failure. But plain non-strict validation exits 0 on *all* warnings — an
        # unrecognized top-level plugin.json field (a typo such as "komands") is only a
        # warning, so it would otherwise ship CI-green. So: run the same non-strict
        # command, then fail on any warning that is not the one allowlisted below.
        # `--json` (CLI >= 2.1.259) gives a documented report: `success`, `manifest`,
        # `contents[]`, each with `errors`/`warnings`/`notes`; gate on those, not on text layout.
        run: |
          status=0
          claude plugin validate .claude-plugin/plugin.json --json > plugin-validate.json || status=$?
          cat plugin-validate.json
          node - "$status" <<'GATE'
          const fs = require('fs');
          const status = Number(process.argv[2]);
          // Allowlist: the single warning this repo accepts permanently, matched on its full
          // sentence so a different warning that merely mentions CLAUDE.md is not swallowed.
          const ALLOWED = 'CLAUDE.md at the plugin root is not loaded as project context';
          let r;
          try {
            r = JSON.parse(fs.readFileSync('plugin-validate.json', 'utf8'));
          } catch (e) {
            console.log(`claude plugin validate exited ${status} without a JSON report (${e.message})`);
            process.exit(1);
          }
          const parts = [r.manifest, ...(r.contents || [])].filter(Boolean);
          const tag = (p, items) => (items || []).map((i) => ({ file: p.file, ...i }));
          const errors = parts.flatMap((p) => tag(p, p.errors));
          const warnings = parts.flatMap((p) => tag(p, p.warnings));
          const allowed = warnings.filter((w) => String(w.message).startsWith(ALLOWED));
          const unexpected = warnings.filter((w) => !String(w.message).startsWith(ALLOWED));
          // Positive control: if the allowlisted warning is not seen, the report format changed
          // (or CLAUDE.md moved) and the gate would be blind -- fail rather than pass silently.
          if (!allowed.length) {
            console.log('The allowlisted CLAUDE.md warning was not reported: the validator report format changed, so this gate cannot be trusted. Re-check the step against the current CLI.');
            process.exit(1);
          }
          if (status !== 0 || !r.success || errors.length || unexpected.length) {
            console.log("Non-allowlisted result(s) from 'claude plugin validate .claude-plugin/plugin.json':");
            console.log(JSON.stringify({ exit: status, success: r.success, errors, warnings: unexpected }, null, 2));
            process.exit(1);
          }
          console.log('OK: plugin manifest and components validated; only the allowlisted CLAUDE.md warning.');
          GATE
      # Eval suite (evals/**/case.yaml) -- deliberately NOT a push/PR gate. `claude plugin eval`
      # needs Claude Code >= 2.1.269 (https://code.claude.com/docs/en/plugin-evals#requirements;
      # the pin above meets it), but every case is a paid model call that needs an API credential
      # such as an ANTHROPIC_API_KEY secret. To run it on demand, add `workflow_dispatch:` under
      # `on:` and a separate job with `if: github.event_name == 'workflow_dispatch'` that repeats
      # the checkout, setup-node and CLI-install steps, then runs:
      #
      # - name: Plugin eval suite
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: claude plugin eval . --trust-plugin --json eval-results.json --threshold 0.8 --model claude-opus-5-5 --judge-model claude-haiku-5-5 --no-publish --max-cost-usd 20
      #
      # --trust-plugin: a run that cannot ask (no terminal, or --json) is refused with exit 1
      # at the first-run trust prompt. --model must equal the `model:` pinned in
      # skills/*/SKILL.md; bump both together.
